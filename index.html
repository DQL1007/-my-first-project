<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>鹈鹕骑自行车 · SVG 2D 动画</title>
<style>
  html, body {
    margin: 0;
    min-height: 100%;
    display: grid;
    place-items: center;
    background: radial-gradient(circle at 50% 15%, #26344a, #080d16 75%);
    font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
  }
  .stage { width: min(96vw, 960px); }
  svg {
    width: 100%;
    height: auto;
    display: block;
    border-radius: 20px;
    box-shadow: 0 30px 80px -20px rgba(0, 0, 0, .9);
  }

  /* 云朵飘动 */
  .cloud {
    animation-name: drift;
    animation-timing-function: linear;
    animation-iteration-count: infinite;
  }
  @keyframes drift {
    from { transform: translateX(0); }
    to   { transform: translateX(-1500px); }
  }

  /* 地面虚线滚动 */
  .dash { animation: dashmove .55s linear infinite; }
  @keyframes dashmove {
    from { stroke-dashoffset: 0; }
    to   { stroke-dashoffset: 70; }
  }

  /* 速度线 */
  .speed { animation: zoom 1.3s linear infinite; }
  @keyframes zoom {
    0%   { transform: translateX(140px); opacity: 0; }
    25%  { opacity: .55; }
    100% { transform: translateX(-300px); opacity: 0; }
  }
</style>
</head>
<body>
<div class="stage">
<svg viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg"
     role="img" aria-label="一只鹈鹕骑着自行车向前飞奔">

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#5EB6E8"/>
      <stop offset="55%"  stop-color="#A6DDF5"/>
      <stop offset="100%" stop-color="#E9F8FF"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#93D46E"/>
      <stop offset="100%" stop-color="#5AA343"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0%"   stop-color="#FFF7CE" stop-opacity=".95"/>
      <stop offset="60%"  stop-color="#FFE066" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#FFE066" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="groundShadow">
      <stop offset="0%"   stop-color="#000" stop-opacity=".20"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- ===================== 背景 ===================== -->
  <rect width="800" height="500" fill="url(#sky)"/>

  <!-- 太阳 -->
  <circle cx="662" cy="92" r="112" fill="url(#glow)"/>
  <circle cx="662" cy="92" r="34" fill="#FFE873"/>

  <!-- 云 -->
  <g class="cloud" style="animation-duration:26s">
    <g transform="translate(860,72)" opacity=".92">
      <ellipse cx="0"   cy="0"  rx="48" ry="26" fill="#fff"/>
      <ellipse cx="42"  cy="9"  rx="32" ry="18" fill="#fff"/>
      <ellipse cx="-40" cy="10" rx="28" ry="16" fill="#fff"/>
    </g>
  </g>
  <g class="cloud" style="animation-duration:34s; animation-delay:-12s">
    <g transform="translate(1150,142)" opacity=".8">
      <ellipse cx="0"   cy="0" rx="40" ry="22" fill="#fff"/>
      <ellipse cx="34"  cy="8" rx="26" ry="15" fill="#fff"/>
      <ellipse cx="-32" cy="7" rx="24" ry="14" fill="#fff"/>
    </g>
  </g>
  <g class="cloud" style="animation-duration:30s; animation-delay:-21s">
    <g transform="translate(980,44)" opacity=".72">
      <ellipse cx="0"  cy="0" rx="34" ry="18" fill="#fff"/>
      <ellipse cx="28" cy="6" rx="22" ry="13" fill="#fff"/>
    </g>
  </g>

  <!-- 远山 -->
  <ellipse cx="120" cy="458" rx="240" ry="82" fill="#96D472"/>
  <ellipse cx="520" cy="472" rx="300" ry="98" fill="#83C95F"/>
  <ellipse cx="790" cy="458" rx="215" ry="78" fill="#96D472"/>

  <!-- 草地 -->
  <rect x="0" y="430" width="800" height="70" fill="url(#grass)"/>
  <path d="M0,430 H800" stroke="#5C9E42" stroke-width="4"/>

  <!-- 滚动虚线 -->
  <line class="dash" x1="-100" y1="466" x2="900" y2="466"
        stroke="#A9E284" stroke-width="6" stroke-linecap="round"
        stroke-dasharray="40 30" opacity=".9"/>

  <!-- 速度线 -->
  <g stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity=".5">
    <line class="speed" x1="150" y1="242" x2="215" y2="242" style="animation-delay:0s"/>
    <line class="speed" x1="120" y1="308" x2="185" y2="308" style="animation-delay:-.45s"/>
    <line class="speed" x1="160" y1="368" x2="225" y2="368" style="animation-delay:-.9s"/>
  </g>

  <!-- 地面投影 -->
  <ellipse cx="405" cy="434" rx="215" ry="12" fill="url(#groundShadow)"/>

  <!-- ===================== 后轮 ===================== -->
  <g id="rearWheel">
    <circle cx="250" cy="360" r="70" fill="none" stroke="#232A33" stroke-width="10"/>
    <circle cx="250" cy="360" r="59" fill="none" stroke="#CFD8E3" stroke-width="5"/>
    <g stroke="#AAB6C4" stroke-width="2">
      <line x1="250" y1="360" x2="306"   y2="360"/>
      <line x1="250" y1="360" x2="289.6" y2="399.6"/>
      <line x1="250" y1="360" x2="250"   y2="416"/>
      <line x1="250" y1="360" x2="210.4" y2="399.6"/>
      <line x1="250" y1="360" x2="194"   y2="360"/>
      <line x1="250" y1="360" x2="210.4" y2="320.4"/>
      <line x1="250" y1="360" x2="250"   y2="304"/>
      <line x1="250" y1="360" x2="289.6" y2="320.4"/>
    </g>
    <circle cx="250" cy="360" r="8" fill="#5B6673"/>
  </g>

  <!-- ===================== 远侧腿（在车架后面） ===================== -->
  <path id="legBack" d="" fill="none" stroke="#C97D22"
        stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===================== 车架 ===================== -->
  <g stroke="#2E3A48" stroke-width="9" stroke-linecap="round" fill="none">
    <line x1="250" y1="360" x2="390" y2="360"/>   <!-- 后下叉 -->
    <line x1="250" y1="360" x2="338" y2="262"/>   <!-- 后上叉 -->
    <line x1="390" y1="360" x2="338" y2="262"/>   <!-- 座管 -->
    <line x1="390" y1="360" x2="534" y2="270"/>   <!-- 下管 -->
    <line x1="338" y1="262" x2="522" y2="250"/>   <!-- 上管 -->
    <line x1="522" y1="250" x2="534" y2="270"/>   <!-- 头管 -->
    <line x1="534" y1="270" x2="560" y2="360"/>   <!-- 前叉 -->
  </g>

  <!-- 链条 -->
  <g stroke="#4A5563" stroke-width="3" fill="none">
    <line x1="252" y1="349" x2="390" y2="338"/>
    <line x1="252" y1="371" x2="390" y2="382"/>
  </g>
  <circle cx="250" cy="360" r="12" fill="none" stroke="#7C8798" stroke-width="4"/>

  <!-- ===================== 前轮 ===================== -->
  <g id="frontWheel">
    <circle cx="560" cy="360" r="70" fill="none" stroke="#232A33" stroke-width="10"/>
    <circle cx="560" cy="360" r="59" fill="none" stroke="#CFD8E3" stroke-width="5"/>
    <g stroke="#AAB6C4" stroke-width="2">
      <line x1="560" y1="360" x2="616"   y2="360"/>
      <line x1="560" y1="360" x2="599.6" y2="399.6"/>
      <line x1="560" y1="360" x2="560"   y2="416"/>
      <line x1="560" y1="360" x2="520.4" y2="399.6"/>
      <line x1="560" y1="360" x2="504"   y2="360"/>
      <line x1="560" y1="360" x2="520.4" y2="320.4"/>
      <line x1="560" y1="360" x2="560"   y2="304"/>
      <line x1="560" y1="360" x2="599.6" y2="320.4"/>
    </g>
    <circle cx="560" cy="360" r="8" fill="#5B6673"/>
  </g>

  <!-- ===================== 曲柄 & 踏板 ===================== -->
  <g id="crankset">
    <circle cx="390" cy="360" r="24" fill="none" stroke="#8B98A8" stroke-width="4"/>
    <circle cx="390" cy="360" r="24" fill="none" stroke="#B9C4D0"
            stroke-width="2" stroke-dasharray="3 5"/>
    <line id="crankBack"  x1="390" y1="360" x2="390" y2="394"
          stroke="#6B7885" stroke-width="7" stroke-linecap="round"/>
    <line id="crankFront" x1="390" y1="360" x2="390" y2="326"
          stroke="#8B98A8" stroke-width="8" stroke-linecap="round"/>
    <g id="pedalBack"><rect x="-11" y="-4.5" width="22" height="9" rx="4" fill="#5B6875"/></g>
    <g id="pedalFront"><rect x="-11" y="-4.5" width="22" height="9" rx="4" fill="#7C8A99"/></g>
    <circle cx="390" cy="360" r="6" fill="#5B6875"/>
  </g>

  <!-- ===================== 近侧腿 ===================== -->
  <path id="legFront" d="" fill="none" stroke="#F0A03C"
        stroke-width="12" stroke-linecap="round" stroke-linejoin="round"/>

  <!-- ===================== 鹈鹕 ===================== -->
  <!-- 尾羽 -->
  <ellipse cx="262" cy="230" rx="30" ry="17" fill="#E9DDC5"
           transform="rotate(-14 262 230)"/>

  <!-- 脖子 + 头 + 喙（整体随踏板节奏轻摆） -->
  <g>
    <animateTransform attributeName="transform" type="rotate"
      values="-2.5 356 200; 2.5 356 200; -2.5 356 200"
      dur="1.4s" repeatCount="indefinite"
      calcMode="spline" keySplines="0.45 0 0.55 1; 0.45 0 0.55 1"/>

    <!-- 脖子 -->
    <path d="M356,200 C366,146 408,110 476,112"
          fill="none" stroke="#FDF7EA" stroke-width="24" stroke-linecap="round"/>

    <!-- 头 -->
    <circle cx="505" cy="116" r="26" fill="#FDF7EA"/>

    <!-- 喉囊 -->
    <path d="M512,126 C520,182 562,198 648,136 C600,160 550,152 512,126 Z"
          fill="#FBC56A"/>
    <path d="M512,126 C520,182 562,198 648,136"
          fill="none" stroke="#E5A044" stroke-width="2" opacity=".8"/>

    <!-- 上喙 -->
    <path d="M514,104 Q586,114 652,134 Q584,128 512,126 Z" fill="#F5A623"/>
    <path d="M514,104 Q586,114 652,134"
          fill="none" stroke="#D98E1F" stroke-width="2"/>

    <!-- 眼睛 -->
    <circle cx="514" cy="100" r="5.5" fill="#2B2B2B"/>
    <circle cx="516" cy="98"  r="2"   fill="#ffffff"/>

    <!-- 头顶小羽冠 -->
    <path d="M486,94 Q478,72 494,66 Q495,84 502,92 Z" fill="#EFE3CB"/>
  </g>

  <!-- 身体 -->
  <ellipse cx="330" cy="224" rx="54" ry="40" fill="#EFE3CB"/>
  <ellipse cx="325" cy="219" rx="50" ry="36" fill="#FDF7EA"/>

  <!-- 翅膀（搭在车把上） -->
  <g>
    <path d="M348,206 C404,190 484,204 552,236"
          fill="none" stroke="#F3EADA" stroke-width="30" stroke-linecap="round"/>
    <g stroke="#DFD2B8" stroke-width="2.5" fill="none" opacity=".85">
      <path d="M462,210 q24,12 42,20"/>
      <path d="M486,216 q24,12 42,18"/>
      <path d="M510,222 q22,12 40,16"/>
    </g>
  </g>

  <!-- ===================== 车座 & 车把（压在身体之下） ===================== -->
  <ellipse cx="336" cy="256" rx="30" ry="10" fill="#1E2836"
           transform="rotate(-8 336 256)"/>

  <g stroke="#2E3A48" stroke-linecap="round" fill="none">
    <line x1="522" y1="250" x2="531" y2="234" stroke-width="8"/>
    <path d="M494,244 Q530,224 568,240" stroke-width="8"/>
  </g>
  <circle cx="566" cy="240" r="6" fill="#1E2836"/>

</svg>
</div>

<script>
(function () {
  const BB        = { x: 390, y: 360 };   // 中轴
  const CRANK_R   = 34;                   // 曲柄半径
  const CYCLE     = 1.4;                  // 一圈秒数
  const OMEGA     = (Math.PI * 2) / CYCLE;

  const HIP_F = { x: 352, y: 262 };       // 近侧髋
  const HIP_B = { x: 338, y: 264 };       // 远侧髋
  const L1 = 80, L2 = 80;                 // 大腿 / 小腿

  const $ = id => document.getElementById(id);
  const rearWheel  = $('rearWheel');
  const frontWheel = $('frontWheel');
  const legFront   = $('legFront');
  const legBack    = $('legBack');
  const crankFront = $('crankFront');
  const crankBack  = $('crankBack');
  const pedalFront = $('pedalFront');
  const pedalBack  = $('pedalBack');

  /* 两段式 IK：根据髋与脚求膝盖位置，bend=-1 让膝盖朝前 */
  function solveKnee(hip, foot, bend) {
    const dx = foot.x - hip.x;
    const dy = foot.y - hip.y;
    const len = Math.hypot(dx, dy) || 0.001;

    let d = Math.min(len, L1 + L2 - 0.5);
    d = Math.max(d, Math.abs(L1 - L2) + 0.5);

    const a = (L1 * L1 - L2 * L2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, L1 * L1 - a * a));
    const ux = dx / len, uy = dy / len;

    return {
      x: hip.x + a * ux + bend * h * (-uy),
      y: hip.y + a * uy + bend * h * (ux)
    };
  }

  let crankAngle = 0;
  let wheelAngle = 0;
  let lastT = null;

  function tick(ts) {
    if (lastT === null) lastT = ts;
    let dt = (ts - lastT) / 1000;
    lastT = ts;
    if (dt > 0.05) dt = 0.05;   // 防止切后台后跳帧

    crankAngle += OMEGA * dt;
    wheelAngle += OMEGA * dt;

    // —— 车轮旋转 ——
    const deg = wheelAngle * 180 / Math.PI;
    rearWheel.setAttribute('transform',  'rotate(' + deg + ' 250 360)');
    frontWheel.setAttribute('transform', 'rotate(' + deg + ' 560 360)');

    // —— 踏板位置 ——
    const ca = Math.cos(crankAngle), sa = Math.sin(crankAngle);
    const pF = { x: BB.x + CRANK_R * ca, y: BB.y + CRANK_R * sa };
    const pB = { x: BB.x - CRANK_R * ca, y: BB.y - CRANK_R * sa };

    crankFront.setAttribute('x2', pF.x);
    crankFront.setAttribute('y2', pF.y);
    crankBack.setAttribute('x2', pB.x);
    crankBack.setAttribute('y2', pB.y);

    pedalFront.setAttribute('transform', 'translate(' + pF.x + ',' + pF.y + ')');
    pedalBack.setAttribute('transform',  'translate(' + pB.x + ',' + pB.y + ')');

    // —— 双腿 ——
    const kF = solveKnee(HIP_F, pF, -1);
    legFront.setAttribute('d',
      'M' + HIP_F.x + ',' + HIP_F.y +
      ' L' + kF.x + ',' + kF.y +
      ' L' + pF.x + ',' + pF.y);

    const kB = solveKnee(HIP_B, pB, -1);
    legBack.setAttribute('d',
      'M' + HIP_B.x + ',' + HIP_B.y +
      ' L' + kB.x + ',' + kB.y +
      ' L' + pB.x + ',' + pB.y);

    requestAnimationFrame(tick);
  }

  requestAnimationFrame(tick);
})();
</script>
</body>
</html>
