<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>鹈鹕骑自行车</title>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        overflow: hidden;
        background: #87ceeb;
        font-family: Arial, sans-serif;
    }

    .scene {
        width: 100vw;
        height: 100vh;
        min-height: 500px;
        position: relative;
    }

    svg {
        width: 100%;
        height: 100%;
        display: block;
    }

    /* 云朵移动 */
    .cloud {
        animation: cloudMove 25s linear infinite;
    }

    .cloud2 {
        animation: cloudMove 35s linear infinite reverse;
    }

    @keyframes cloudMove {
        from {
            transform: translateX(-150px);
        }
        to {
            transform: translateX(1100px);
        }
    }

    /* 自行车整体轻微上下颠簸 */
    #bikeGroup {
        animation: bikeBounce 0.45s ease-in-out infinite alternate;
        transform-origin: center;
    }

    @keyframes bikeBounce {
        from {
            transform: translateY(0px);
        }
        to {
            transform: translateY(-3px);
        }
    }

    /* 车轮 */
    .wheel {
        transform-box: fill-box;
        transform-origin: center;
        animation: wheelRotate 0.8s linear infinite;
    }

    @keyframes wheelRotate {
        to {
            transform: rotate(360deg);
        }
    }

    /* 脚踏板 */
    #pedal {
        transform-box: fill-box;
        transform-origin: center;
        animation: pedalRotate 0.8s linear infinite;
    }

    @keyframes pedalRotate {
        to {
            transform: rotate(360deg);
        }
    }

    /* 鹈鹕腿 */
    .leg {
        transform-box: fill-box;
        transform-origin: top center;
        animation: legMove 0.8s ease-in-out infinite alternate;
    }

    .leg2 {
        animation-delay: -0.4s;
    }

    @keyframes legMove {
        0% {
            transform: rotate(25deg);
        }
        100% {
            transform: rotate(-25deg);
        }
    }

    /* 翅膀 */
    #wing {
        transform-box: fill-box;
        transform-origin: 85% 20%;
        animation: wingMove 1.2s ease-in-out infinite alternate;
    }

    @keyframes wingMove {
        0% {
            transform: rotate(3deg);
        }
        100% {
            transform: rotate(-8deg);
        }
    }

    /* 身体呼吸 */
    #pelicanBody {
        transform-box: fill-box;
        transform-origin: center;
        animation: breathing 1.5s ease-in-out infinite alternate;
    }

    @keyframes breathing {
        from {
            transform: scale(1);
        }
        to {
            transform: scale(1.015);
        }
    }

    /* 地面移动线 */
    .roadLine {
        animation: roadMove 1s linear infinite;
    }

    @keyframes roadMove {
        from {
            transform: translateX(0);
        }
        to {
            transform: translateX(-300px);
        }
    }

    /* 按钮 */
    .controls {
        position: absolute;
        left: 50%;
        bottom: 25px;
        transform: translateX(-50%);
        z-index: 10;
    }

    button {
        border: none;
        padding: 12px 24px;
        border-radius: 30px;
        background: rgba(255,255,255,.9);
        color: #333;
        font-size: 16px;
        cursor: pointer;
        box-shadow: 0 5px 20px rgba(0,0,0,.15);
    }

    button:hover {
        background: white;
    }

    .title {
        position: absolute;
        top: 25px;
        left: 50%;
        transform: translateX(-50%);
        z-index: 5;
        font-size: clamp(20px, 4vw, 36px);
        font-weight: bold;
        color: white;
        text-shadow: 0 3px 8px rgba(0,0,0,.25);
        white-space: nowrap;
    }
</style>
</head>

<body>

<div class="scene">

    <div class="title">🦤 鹈鹕骑自行车 🚲</div>

    <svg viewBox="0 0 1000 600"
         xmlns="http://www.w3.org/2000/svg">

        <!-- =========================
             天空
        ========================== -->
        <rect width="1000" height="600" fill="#87CEEB"/>

        <!-- 太阳 -->
        <circle cx="850" cy="90" r="55" fill="#FFD95A"/>

        <!-- 云朵 -->
        <g class="cloud" opacity=".9">
            <circle cx="120" cy="100" r="30" fill="white"/>
            <circle cx="155" cy="90" r="40" fill="white"/>
            <circle cx="200" cy="105" r="30" fill="white"/>
            <rect x="120" y="100" width="80" height="35" fill="white"/>
        </g>

        <g class="cloud2" opacity=".75">
            <circle cx="550" cy="150" r="25" fill="white"/>
            <circle cx="585" cy="140" r="35" fill="white"/>
            <circle cx="625" cy="155" r="25" fill="white"/>
            <rect x="550" y="150" width="75" height="30" fill="white"/>
        </g>

        <!-- =========================
             远处山
        ========================== -->
        <path d="M0 390 L180 210 L320 390 Z"
              fill="#78B66A"/>

        <path d="M200 390 L430 170 L650 390 Z"
              fill="#69A95D"/>

        <path d="M550 390 L760 220 L1000 390 Z"
              fill="#599B55"/>

        <!-- =========================
             草地
        ========================== -->
        <rect y="370" width="1000" height="230" fill="#70B85B"/>

        <!-- 道路 -->
        <path d="M0 430
                 Q500 350 1000 430
                 L1000 600
                 L0 600 Z"
              fill="#555"/>

        <!-- 道路白线 -->
        <g class="roadLine">
            <rect x="50" y="500" width="150" height="12" rx="6" fill="white"/>
            <rect x="350" y="480" width="150" height="12" rx="6" fill="white"/>
            <rect x="650" y="490" width="150" height="12" rx="6" fill="white"/>
            <rect x="950" y="510" width="150" height="12" rx="6" fill="white"/>
        </g>

        <!-- =========================
             自行车 + 鹈鹕
        ========================== -->
        <g id="bikeGroup">

            <!-- 自行车 -->
            <g stroke="#222" stroke-width="7" fill="none">

                <!-- 后轮 -->
                <g class="wheel">
                    <circle cx="390" cy="440" r="75"
                            stroke="#222"
                            stroke-width="7"
                            fill="none"/>

                    <circle cx="390" cy="440" r="6"
                            fill="#222"/>

                    <line x1="390" y1="365" x2="390" y2="515"/>
                    <line x1="315" y1="440" x2="465" y2="440"/>
                    <line x1="337" y1="387" x2="443" y2="493"/>
                    <line x1="443" y1="387" x2="337" y2="493"/>
                </g>

                <!-- 前轮 -->
                <g class="wheel">
                    <circle cx="650" cy="440" r="75"
                            stroke="#222"
                            stroke-width="7"
                            fill="none"/>

                    <circle cx="650" cy="440" r="6"
                            fill="#222"/>

                    <line x1="650" y1="365" x2="650" y2="515"/>
                    <line x1="575" y1="440" x2="725" y2="440"/>
                    <line x1="597" y1="387" x2="703" y2="493"/>
                    <line x1="703" y1="387" x2="597" y2="493"/>
                </g>

                <!-- 车架 -->
                <path d="
                    M390 440
                    L470 360
                    L560 440
                    L390 440
                    L650 440
                    L560 440
                    L535 340
                    L470 360
                "/>

                <!-- 车把 -->
                <path d="M535 340 L650 330 L665 350"/>
                <path d="M640 325 L680 325"/>

                <!-- 座椅 -->
                <path d="M450 350 L495 350"
                      stroke-width="10"/>

                <!-- 脚踏中心 -->
                <circle cx="560" cy="440" r="15"
                        fill="#333"
                        stroke="none"/>

                <!-- 脚踏 -->
                <g id="pedal">
                    <line x1="560" y1="440" x2="590" y2="410"/>
                    <line x1="560" y1="440" x2="530" y2="470"/>
                    <rect x="585" y="404" width="25" height="8"
                          rx="4" fill="#222" stroke="none"/>
                    <rect x="505" y="466" width="25" height="8"
                          rx="4" fill="#222" stroke="none"/>
                </g>
            </g>

            <!-- =========================
                 鹈鹕
            ========================== -->

            <g id="pelicanBody">

                <!-- 身体 -->
                <ellipse cx="500"
                         cy="280"
                         rx="90"
                         ry="115"
                         fill="#F5F3EA"
                         stroke="#333"
                         stroke-width="5"/>

                <!-- 肚子 -->
                <ellipse cx="525"
                         cy="310"
                         rx="60"
                         ry="80"
                         fill="#FFFDF5"/>

                <!-- 翅膀 -->
                <g id="wing">
                    <path d="
                        M555 215
                        Q650 235 615 330
                        Q600 360 560 315
                        Q585 275 555 215
                    "
                    fill="#D7D5CA"
                    stroke="#333"
                    stroke-width="5"/>

                    <!-- 羽毛线 -->
                    <path d="M585 250 Q610 280 590 315"
                          fill="none"
                          stroke="#999"
                          stroke-width="4"/>

                    <path d="M575 245 Q595 270 575 300"
                          fill="none"
                          stroke="#999"
                          stroke-width="4"/>
                </g>

                <!-- 脖子 -->
                <path d="
                    M470 230
                    Q450 170 490 125
                    Q525 90 565 130
                    L550 235
                    Z"
                    fill="#F5F3EA"
                    stroke="#333"
                    stroke-width="5"/>

                <!-- 头 -->
                <circle cx="530"
                        cy="115"
                        r="62"
                        fill="#F5F3EA"
                        stroke="#333"
                        stroke-width="5"/>

                <!-- 鹈鹕眼睛 -->
                <circle cx="550"
                        cy="105"
                        r="9"
                        fill="#111"/>

                <circle cx="553"
                        cy="101"
                        r="3"
                        fill="white"/>

                <!-- 鹈鹕大嘴 -->
                <path d="
                    M570 125
                    Q665 115 720 150
                    Q675 180 570 155
                    Z"
                    fill="#F2A94E"
                    stroke="#333"
                    stroke-width="5"/>

                <!-- 嘴巴下方 -->
                <path d="
                    M570 155
                    Q650 185 715 150
                    Q660 220 570 175
                    Z"
                    fill="#F7B95E"
                    stroke="#333"
                    stroke-width="5"/>

                <!-- 嘴部细节 -->
                <path d="M600 155 Q650 155 700 155"
                      fill="none"
                      stroke="#D47A27"
                      stroke-width="3"/>

                <!-- 腿 -->
                <g class="leg">
                    <path d="M470 355 L455 420"
                          stroke="#E6A23C"
                          stroke-width="12"
                          stroke-linecap="round"/>

                    <path d="M455 420 L440 438"
                          stroke="#E6A23C"
                          stroke-width="9"
                          stroke-linecap="round"/>
                </g>

                <g class="leg leg2">
                    <path d="M520 360 L545 415"
                          stroke="#E6A23C"
                          stroke-width="12"
                          stroke-linecap="round"/>

                    <path d="M545 415 L565 430"
                          stroke="#E6A23C"
                          stroke-width="9"
                          stroke-linecap="round"/>
                </g>

                <!-- 脚蹼 -->
                <path d="
                    M440 438
                    Q425 445 410 438
                    Q425 455 440 447
                    Q455 455 465 440
                "
                fill="#E6A23C"
                stroke="#333"
                stroke-width="3"/>

                <path d="
                    M565 430
                    Q580 440 595 432
                    Q585 450 570 442
                    Q555 450 548 435
                "
                fill="#E6A23C"
                stroke="#333"
                stroke-width="3"/>

            </g>

        </g>

    </svg>

    <!-- 控制按钮 -->
    <div class="controls">
        <button id="toggleBtn">⏸ 暂停动画</button>
    </div>

</div>

<script>
const button = document.getElementById("toggleBtn");

let paused = false;

button.addEventListener("click", () => {

    paused = !paused;

    if (paused) {
        document.querySelectorAll("*").forEach(el => {
            el.style.animationPlayState = "paused";
        });

        button.textContent = "▶️ 播放动画";

    } else {
        document.querySelectorAll("*").forEach(el => {
            el.style.animationPlayState = "running";
        });

        button.textContent = "⏸ 暂停动画";
    }

});
</script>

</body>
</html>
